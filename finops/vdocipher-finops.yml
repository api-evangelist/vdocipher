meters:
- name: bandwidth_gb
  description: Gigabytes of video streaming/delivery bandwidth consumed against the plan bundle.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - video
- name: storage_gb
  description: Gigabytes of transcoded video stored against the plan's storage allowance.
  unit: gigabytes
  aggregation: max
  dimensions:
  - account
  - folder
- name: bandwidth_overage_gb
  description: Prepaid per-GB bandwidth beyond the bundle; unit price decreases with bulk purchase.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
- name: storage_overage_gb
  description: Prepaid per-GB storage beyond the bundle allowance.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
- name: videos_stored
  description: Count of videos stored in the account (drives storage consumption).
  unit: videos
  aggregation: max
  dimensions:
  - account
  - folder
principles:
- name: Visibility
  description: Track bandwidth burn and storage in the dashboard; watch remaining credit and plan expiry.
- name: Allocation
  description: Organize videos into folders and tags to attribute bandwidth/storage to courses, teams, or tenants.
- name: Optimization
  description: Right-size the annual bundle to expected views; buy overage in bulk for lower per-GB rates; prune stale videos to reclaim storage.
- name: Accountability
  description: Assign an owner to monitor credit depletion and renew before expiry to avoid playback interruption.
