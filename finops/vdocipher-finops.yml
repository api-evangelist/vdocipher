description: >-
  FinOps view of VdoCipher spend. VdoCipher bills prepaid annual bundles of
  bandwidth and storage with a one-year validity, plus prepaid per-GB overage
  for bandwidth and storage. The main cost drivers are viewer bandwidth
  (streaming delivery) and stored video volume; the server API itself (upload,
  videos, folders, OTP, watermark) is not metered per request. Cost control is
  primarily about right-sizing the bundle, monitoring bandwidth burn, and
  purchasing overage in bulk for lower unit rates.
notes: >-
  Bundle sizes, prices, and overage rates change and vary by plan and region;
  verify against the VdoCipher pricing page during reconciliation.
